<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your BookNest account.">
    <title>Login | BookNest</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">BookNest</a>

            <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
                ☰
            </button>

            <nav id="main-nav" class="main-nav">
                <a href="index.html">Home</a>
                <a href="search.html">Discover</a>
                <a href="library.html">My Library</a>
                <a href="register.html">Sign Up</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-container">
            <div class="auth-heading">
                <h1>Welcome Back</h1>
                <p>Log in to continue your reading journey.</p>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>

                <p id="login-message" class="auth-message" aria-live="polite"></p>

                <button type="submit" id="login-button" class="auth-button">
                    Log In
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="current-year"></span> BookNest. Discover. Organize. Read.</p>
    </footer>

    <script type="module" src="js/login.mjs"></script>
</body>

</html>
